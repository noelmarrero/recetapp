<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="index.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp</span>
            </a>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="index.html#recetas">Recetas</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="publicar-receta.html">Publicar</a>
                <a href="perfil.html">Perfil</a>
            </nav>

            <a class="boton-secundario" href="iniciar-sesion.html">Cerrar sesión</a>
        </div>
    </header>

    <main class="contenedor perfil">
        <section class="datos-perfil">
            <div class="foto-perfil">NM</div>

            <div class="informacion-perfil">
                <h1>Noel Marrero</h1>
                <p>@cocina_con_noel</p>
                <p>Me gusta compartir recetas fáciles.</p>
            </div>

            <button class="boton" id="editar-perfil" type="button">Editar perfil</button>
        </section>

        <section class="recetas-perfil">
            <div class="titulo-perfil">
                <h2>Mis recetas</h2>
                <a class="boton" href="publicar-receta.html">Nueva receta</a>
            </div>

            <div class="receta-publicada">
                <img class="imagen-pequena" src="imagenes/pasta.jpg" alt="Pasta con salsa casera">
                <div>
                    <h3><a href="receta.html">Pasta con salsa casera</a></h3>
                    <p>Publicada el 2 de septiembre de 2026</p>
                    <label for="estado-pasta">Estado:</label>
                    <select class="estado-receta" id="estado-pasta" data-receta="Pasta con salsa casera">
                        <option>Disponible</option>
                        <option>No disponible</option>
                    </select>
                </div>
            </div>

            <div class="receta-publicada">
                <img class="imagen-pequena" src="imagenes/ensalada.jpg" alt="Ensalada completa">
                <div>
                    <h3>Ensalada completa</h3>
                    <p>Publicada el 27 de agosto de 2026</p>
                    <label for="estado-ensalada">Estado:</label>
                    <select class="estado-receta" id="estado-ensalada" data-receta="Ensalada completa">
                        <option>Disponible</option>
                        <option>No disponible</option>
                    </select>
                </div>
            </div>

            <p class="mensaje-exito" id="mensaje-estado"></p>
        </section>
    </main>

    <footer>
        <div class="contenedor">
            <p>Recetapp - 2026</p>
        </div>
    </footer>

    <script src="js/perfil.js"></script>
</body>
</html>
