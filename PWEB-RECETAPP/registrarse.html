<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/registrarse.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="index.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp</span>
            </a>
            <a href="index.html">Volver al inicio</a>
        </div>
    </header>

    <main class="pagina-registro">
        <div class="registro-contenedor">
            <h1>Crear una cuenta</h1>
            <p class="descripcion-formulario">Completá el formulario para registrarte.</p>

            {% for mensaje in get_flashed_messages() %}
                <p class="mensaje-error">{{ mensaje }}</p>
            {% endfor %}

            <form id="formulario-registro" action="registrarse.html" method="POST" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <p class="mensaje-error" id="error-nombre"></p>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                    <p class="mensaje-error" id="error-apellido"></p>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="mail" required>
                    <p class="mensaje-error" id="error-correo"></p>
                </div>

                <div class="campo">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" required>
                    <p class="mensaje-error" id="error-usuario"></p>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasenia" required>
                    <p class="mensaje-error" id="error-contrasena"></p>
                </div>

                <div class="campo">
                    <label for="repetir-contrasena">Repetir contraseña</label>
                    <input type="password" id="repetir-contrasena" required>
                    <p class="mensaje-error" id="error-repetir"></p>
                </div>

                <div class="mostrar-contrasena">
                    <input type="checkbox" id="mostrar-contrasena">
                    <label for="mostrar-contrasena">Mostrar contraseñas</label>
                </div>

                <button class="boton boton-formulario" type="submit">Registrarse</button>
            </form>

            <p class="enlace-formulario">
                ¿Ya tenés una cuenta?
                <a href="iniciar-sesion.html">Iniciá sesión</a>
            </p>
        </div>
    </main>

    <footer>
        <div class="contenedor"><p>Recetapp - 2026</p></div>
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>
