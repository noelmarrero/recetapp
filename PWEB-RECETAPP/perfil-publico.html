<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/perfil-publico.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="index.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp</span>
            </a>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="publicar-receta.html">Publicar</a>
                <a href="perfil.html">Perfil</a>
            </nav>
        </div>
    </header>

    <main class="contenedor perfil-publico">
        <section class="usuario-publico">
            <div class="foto-usuario">NM</div>
            <div>
                <h1>Noel Marrero</h1>
                <p>@cocina_con_noel</p>
                <p>Me gusta compartir recetas fáciles.</p>
            </div>
        </section>

        <section class="publicaciones-usuario">
            <h2>Recetas publicadas</h2>

            <article class="publicacion-usuario">
                <img src="imagenes/pasta.jpg" alt="Pasta con salsa">
                <div>
                    <h3>Pasta con salsa casera</h3>
                    <p>Una receta sencilla para preparar en casa.</p>
                    <a href="receta.html">Ver receta</a>
                </div>
            </article>

            <article class="publicacion-usuario">
                <img src="imagenes/ensalada.jpg" alt="Ensalada completa">
                <div>
                    <h3>Ensalada completa</h3>
                    <p>Una opción fresca para el almuerzo.</p>
                    <a href="receta.html">Ver receta</a>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <div class="contenedor">
            <p>Recetapp - 2026</p>
        </div>
    </footer>
</body>
</html>
