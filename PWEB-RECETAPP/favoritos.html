<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/favoritos.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="index.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp</span>
            </a>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="publicar-receta.html">Publicar</a>
                <a href="perfil.html">Perfil</a>
            </nav>
            <a class="boton-secundario" href="cerrar-sesion">Cerrar sesión</a>
        </div>
    </header>

    <main class="contenedor favoritos">
        <h1>Mis recetas favoritas</h1>

        <div class="lista-favoritos">
            {% for receta in recetas %}
                <article class="favorito">
                    <img src="imagenes/{{ receta.imagen or 'logo-recetapp.png' }}" alt="{{ receta.nombre }}">
                    <div>
                        <h2>{{ receta.nombre }}</h2>
                        <p>Tiempo: {{ receta.tiempo }} minutos</p>
                        <a href="receta.html?id={{ receta.id }}">Ver receta</a>

                        <form action="favorito/{{ receta.id }}" method="POST">
                            <input type="hidden" name="destino" value="/favoritos.html">
                            <button type="submit">Quitar de favoritos</button>
                        </form>
                    </div>
                </article>
            {% endfor %}
        </div>

        {% if recetas|length == 0 %}
            <p>Todavía no tenés recetas favoritas.</p>
        {% endif %}
    </main>

    <footer><div class="contenedor"><p>Recetapp - 2026</p></div></footer>
</body>
</html>
