<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/favoritos.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="index.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp</span>
            </a>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="publicar-receta.html">Publicar</a>
                <a href="perfil.html">Perfil</a>
            </nav>
        </div>
    </header>

    <main class="contenedor favoritos">
        <h1>Mis recetas favoritas</h1>

        <div class="lista-favoritos" id="lista-favoritos">
            <article class="favorito">
                <img src="imagenes/pasta.jpg" alt="Pasta con salsa">
                <div>
                    <h2>Pasta con salsa</h2>
                    <p>Tiempo: 30 minutos</p>
                    <a href="receta.html">Ver receta</a>
                    <button class="quitar-favorito" type="button">Quitar de favoritos</button>
                </div>
            </article>

            <article class="favorito">
                <img src="imagenes/torta.jpg" alt="Torta de chocolate">
                <div>
                    <h2>Torta de chocolate</h2>
                    <p>Tiempo: 50 minutos</p>
                    <a href="receta.html">Ver receta</a>
                    <button class="quitar-favorito" type="button">Quitar de favoritos</button>
                </div>
            </article>
        </div>

        <p class="oculto" id="favoritos-vacios">Todavía no tenés recetas favoritas.</p>
    </main>

    <footer>
        <div class="contenedor">
            <p>Recetapp - 2026</p>
        </div>
    </footer>

    <script src="js/favoritos.js"></script>
</body>
</html>
