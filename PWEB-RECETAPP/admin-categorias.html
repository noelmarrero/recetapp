<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar categorías - Recetapp</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <div class="contenedor header-contenido">
            <a class="logo" href="admin.html">
                <img src="imagenes/logo-recetapp.png" alt="Logo de Recetapp">
                <span>Recetapp Admin</span>
            </a>
            <nav>
                <a href="admin.html">Panel</a>
                <a href="admin-recetas.html">Recetas</a>
                <a href="admin-usuarios.html">Usuarios</a>
            </nav>
            <a class="boton-secundario" href="cerrar-sesion">Cerrar sesión</a>
        </div>
    </header>

    <main class="contenedor panel-admin">
        <a class="volver" href="admin.html">Volver al panel</a>
        <h1>Administrar categorías</h1>

        {% for mensaje in get_flashed_messages() %}
            <p class="mensaje-error">{{ mensaje }}</p>
        {% endfor %}

        <form class="formulario-categoria" id="formulario-categoria"
              action="admin-categorias.html" method="POST" novalidate>
            <label for="nueva-categoria">Nueva categoría:</label>
            <input type="text" id="nueva-categoria" name="nombre">
            <button class="boton" type="submit">Crear categoría</button>
            <p class="mensaje-error" id="error-categoria"></p>
        </form>

        <ul class="lista-categorias">
            {% for categoria in categorias %}
                <li>
                    <span>{{ categoria.nombre }}</span>
                    <form action="admin/categoria/{{ categoria.id }}/eliminar" method="POST">
                        <button class="eliminar-categoria" type="submit">Eliminar</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </main>

    <footer><div class="contenedor"><p>Recetapp - Panel de administrador</p></div></footer>
    <script src="js/admin-categorias.js"></script>
</body>
</html>
